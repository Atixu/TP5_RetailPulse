# RetailPulse — pile complète en local.
#   cp .env.example .env && docker compose up -d --build
# Ordre de démarrage : kafka + postgres -> collector -> reference-loader -> producer + spark,
# dashboard sur http://localhost:8501, Spark UI sur http://localhost:4040.

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
  POSTGRES_USER: ${POSTGRES_USER:-retailpulse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
  # Surchargés par tools/benchmark.py (topics dédiés à chaque nombre de partitions).
  TOPIC_ORDERS: ${TOPIC_ORDERS:-retail-orders}
  TOPIC_ORDER_EVENTS: ${TOPIC_ORDER_EVENTS:-retail-order-events}
  EVENT_TOPIC_PARTITIONS: ${EVENT_TOPIC_PARTITIONS:-3}
  CURRENCY: USD

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: retailpulse-kafka
    hostname: kafka
    ports:
      - "9092:9092"            # accès depuis l'hôte : localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # KRaft combiné, sans ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"      # topics créés explicitement (ensure_topics)
      KAFKA_LOG_RETENTION_HOURS: 168                # 7 jours : permet le rejeu
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: retailpulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retailpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    build: ./apps
    image: retailpulse-app:1.0.0
    container_name: retailpulse-collector
    command: ["python", "collector.py"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  reference-loader:
    image: retailpulse-app:1.0.0
    container_name: retailpulse-reference-loader
    command: ["python", "reference_loader.py"]
    environment:
      <<: *app-env
      REPLAY_FROM_START: ${REPLAY_FROM_START:-false}
    depends_on:
      collector:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  producer:
    image: retailpulse-app:1.0.0
    container_name: retailpulse-producer
    command: ["python", "producer.py"]
    stop_signal: SIGTERM
    stop_grace_period: 20s
    environment:
      <<: *app-env
      MIN_INTERVAL_S: ${MIN_INTERVAL_S:-0.5}
      MAX_INTERVAL_S: ${MAX_INTERVAL_S:-2.0}
      RATE: ${RATE:-0}
      MAX_ORDERS: ${MAX_ORDERS:-0}
      PAYMENT_SUCCESS_RATE: ${PAYMENT_SUCCESS_RATE:-0.8}
      CANCEL_AFTER_FAIL_RATE: ${CANCEL_AFTER_FAIL_RATE:-0.5}
    depends_on:
      reference-loader:
        condition: service_completed_successfully
    restart: unless-stopped

  spark:
    build: ./spark
    image: retailpulse-spark:1.0.0
    container_name: retailpulse-spark
    environment:
      <<: *app-env
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_DRIVER_MEMORY: 1g
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:-/checkpoints/retailpulse}
      WATERMARK_DELAY: 10 minutes
      WINDOW_DURATION: 5 minutes
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-5 seconds}
      SHUFFLE_PARTITIONS: ${SHUFFLE_PARTITIONS:-3}
    ports:
      - "4040:4040"            # Spark UI (onglet Structured Streaming)
    volumes:
      - spark_checkpoints:/checkpoints
    depends_on:
      reference-loader:
        condition: service_completed_successfully
    restart: on-failure

  dashboard:
    build: ./dashboard
    image: retailpulse-dashboard:1.0.0
    container_name: retailpulse-dashboard
    environment:
      <<: *app-env
      REFRESH_SECONDS: "10"
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Outils de test : docker compose run --rm tools python inject_event.py --help
  tools:
    image: retailpulse-app:1.0.0
    profiles: ["tools"]
    environment: *app-env
    command: ["python", "inject_event.py", "--help"]

volumes:
  kafka_data:
  pg_data:
  spark_checkpoints:
