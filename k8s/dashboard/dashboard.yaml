apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: retailpulse
spec:
  type: NodePort              # accès : http://localhost:30851
  selector: { app: dashboard }
  ports:
    - { name: http, port: 8501, targetPort: 8501, nodePort: 30851 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: retailpulse
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard, app.kubernetes.io/part-of: retailpulse }
    spec:
      enableServiceLinks: false
      containers:
        - name: dashboard
          image: retailpulse-dashboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8501 }]
          envFrom:
            - configMapRef: { name: retailpulse-config }
            - secretRef: { name: retailpulse-db }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 30
            periodSeconds: 20
