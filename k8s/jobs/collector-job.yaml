# Collecte initiale DummyJSON -> Kafka. Relance maîtrisée : 4 essais, puis échec visible.
apiVersion: batch/v1
kind: Job
metadata:
  name: collector
  namespace: retailpulse
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: collector, app.kubernetes.io/part-of: retailpulse }
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: collector
          image: retailpulse-app:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "collector.py"]
          envFrom:
            - configMapRef: { name: retailpulse-config }
            - secretRef: { name: retailpulse-db }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
