# Kafka 4.0 en mode KRaft combiné (broker + controller), un seul nœud : RF=1.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: retailpulse
spec:
  clusterIP: None              # identité réseau stable des pods du StatefulSet
  selector: { app: kafka }
  ports:
    - { name: client, port: 29092 }
    - { name: controller, port: 9093 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: retailpulse
spec:
  selector: { app: kafka }
  ports:
    - { name: client, port: 29092, targetPort: 29092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: retailpulse
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka, app.kubernetes.io/part-of: retailpulse }
    spec:
      # Sans cela, Kubernetes injecte KAFKA_PORT, KAFKA_SERVICE_HOST… que l'image
      # apache/kafka interpréterait comme des propriétés du broker.
      enableServiceLinks: false
      securityContext: { fsGroup: 1000 }
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          securityContext: { runAsUser: 0 }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports:
            - { name: client, containerPort: 29092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:29092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.retailpulse.svc.cluster.local:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "168" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms512m" }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket: { port: 29092 }
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
